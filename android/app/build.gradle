apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Version comes from the release tag in CI (-PversionName=1.2.3), else a dev default.
def appVersionName = project.findProperty('versionName') ?: '0.1.0-dev'
def parts = appVersionName.tokenize('.-')
def appVersionCode = (project.findProperty('versionCode') ?: (
        parts.size() >= 3 && parts[0].isInteger() && parts[1].isInteger() && parts[2].isInteger()
                ? parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()
                : 1)).toString().toInteger()

// Release signing: only from environment variables (GitHub Secrets in CI). Nothing secret lives in the repo.
def keystorePath = System.getenv('RODGROD_KEYSTORE_PATH')
def hasReleaseSigning = keystorePath != null && new File(keystorePath).exists()

android {
    namespace = "dk.rodgrod.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dk.rodgrod.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('RODGROD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RODGROD_KEY_ALIAS')
                keyPassword System.getenv('RODGROD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        // Content decks (content/*.json at the repo root) are packaged as assets under content/.
        main.assets.srcDirs += ["$buildDir/generated/contentAssets"]
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

def copyContent = tasks.register('copyContentAssets', Copy) {
    from("$rootDir/../content") { include '**/*.json' }
    into("$buildDir/generated/contentAssets/content")
}
preBuild.dependsOn(copyContent)

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':core')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
