name: Release (signed APK)

# Every push to main (and any vX.Y.Z tag) builds a signed APK and publishes it as a GitHub Release.
# Needs four repository secrets (see README "Releases"):
#   RODGROD_KEYSTORE_BASE64, RODGROD_KEYSTORE_PASSWORD, RODGROD_KEY_ALIAS, RODGROD_KEY_PASSWORD
# Until they exist, pushes to main skip the release (with a notice) instead of failing.
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          KS: ${{ secrets.RODGROD_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RODGROD_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RODGROD_KEY_ALIAS }}
          KP: ${{ secrets.RODGROD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing RODGROD_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing RODGROD_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing RODGROD_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing RODGROD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::Missing repository secrets:$missing. See README.md > Releases."
              exit 1
            fi
            echo "::notice::No release: signing secrets not set yet ($missing). See README.md > Releases. The debug APK is still in the CI run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        if: steps.secrets.outputs.ok == 'true'
        id: version
        run: |
          # versionCode must always increase so Android installs the update: use this workflow's run number.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.1.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test and build web UI
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npm ci
          npm test
          npm run build
          ./gradlew --no-daemon :core:test
          npx cap sync android

      - name: Decode keystore
        if: steps.secrets.outputs.ok == 'true'
        env:
          KS: ${{ secrets.RODGROD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.secrets.outputs.ok == 'true'
        working-directory: android
        env:
          RODGROD_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RODGROD_KEYSTORE_PASSWORD: ${{ secrets.RODGROD_KEYSTORE_PASSWORD }}
          RODGROD_KEY_ALIAS: ${{ secrets.RODGROD_KEY_ALIAS }}
          RODGROD_KEY_PASSWORD: ${{ secrets.RODGROD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionName="${{ steps.version.outputs.name }}" -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify signature and rename
        if: steps.secrets.outputs.ok == 'true'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "rodgrod-${{ steps.version.outputs.tag }}.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        if: steps.secrets.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rødgrød ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: rodgrod-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
