name: CI (tests + debug APK)

# Runs on every push (including main) and on pull requests. The debug APK is uploaded as a workflow artifact.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The ubuntu runner ships the Android SDK (ANDROID_HOME); AGP downloads any missing platform.
      - name: Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install JS dependencies
        run: npm ci

      - name: Web UI logic tests
        run: npm test

      - name: Build web UI
        run: npm run build

      - name: Engine, content validation and scoring tool tests (JVM)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :scoring-experiment:test 2>&1 | tee jvm-build.log

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK and run Android unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug 2>&1 | tee ../android-build.log

      - name: Error summary
        if: failure()
        run: |
          for f in jvm-build.log android-build.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            grep -E "^e: |error:|warning:.*\[|What went wrong|FAILED|tests completed|Lint found|Errors found" -A4 "$f" | head -80 || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rodgrod-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            tools/scoring-experiment/build/reports/
            android/app/build/reports/
          if-no-files-found: ignore
